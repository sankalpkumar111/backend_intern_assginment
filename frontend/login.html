<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCTC Next Generation eTicketing - Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f9;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .btn-irctc {
            background-color: #213d77;
            border: none;
            color: white;
            font-weight: 600;
        }
        .btn-irctc:hover {
            background-color: #1a305e;
            color: white;
        }
        .brand-logo {
            width: 80px;
        }
        .form-control:focus {
            border-color: #213d77;
            box-shadow: 0 0 0 0.25rem rgba(33, 61, 119, 0.25);
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-md-5 col-lg-4">

        
        <div class="text-center mb-4">
            <img src="https://www.irctc.co.in/nget/assets/images/second-logo.png"
                 alt="IRCTC Logo" class="brand-logo mb-2">
            <h4 class="fw-bold text-dark">Welcome Back</h4>
            <p class="text-muted small">IRCTC Next Generation eTicketing</p>
        </div>

        
        <div class="card login-card p-4">
            <form id="loginForm">

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">User ID</label>
                    <input type="text" id="username"
                           class="form-control form-control-lg"
                           placeholder="Enter Email / Username"
                           required>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-semibold text-secondary">Password</label>
                        <a href="#" class="text-decoration-none small text-primary">Forgot?</a>
                    </div>
                    <input type="password" id="password"
                           class="form-control form-control-lg"
                           placeholder="••••••••"
                           required>
                </div>

                <button type="submit" class="btn btn-irctc w-100 py-2 mb-3">
                    SIGN IN
                </button>
            </form>

            <div class="text-center">
                <p class="small text-muted mb-0">Don't have an account?</p>
                <a href="register.html"
                   class="text-decoration-none fw-bold"
                   style="color:#fb792b;">
                    REGISTER HERE
                </a>
            </div>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted" style="font-size:0.75rem;">
                By logging in, you agree to the
                <a href="#" class="text-secondary">Terms of Service</a>.
            </p>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

// LOGIN SCRIPT 
<script>
document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("http://127.0.0.1:8000/api/login/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (response.ok) {
            // Save JWT tokens
            localStorage.setItem("access", data.access);
            localStorage.setItem("refresh", data.refresh);

            // Redirect after login
            window.location.href = "index.html";
        } else {
            alert("Invalid username or password");
        }

    } catch (error) {
        alert("Server error. Please try again later.");
        console.error(error);
    }
});
</script>

</body>
</html>
