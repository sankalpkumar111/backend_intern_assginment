<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRCTC - Create Account</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f9;
            font-family: 'Inter', sans-serif;
        }
        .register-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            background: #ffffff;
        }
        .btn-irctc {
            background-color: #213d77;
            border: none;
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-irctc:hover {
            background-color: #1a305e;
            color: white;
            transform: translateY(-1px);
        }
        .brand-logo {
            width: 70px;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
        }
        .form-control {
            border-radius: 8px;
            padding: 0.6rem 1rem;
        }
        .form-control:focus {
            border-color: #213d77;
            box-shadow: 0 0 0 0.25rem rgba(33, 61, 119, 0.1);
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
    <div class="col-12 col-md-6 col-lg-5">

     
        <div class="text-center mb-4">
            <img src="https://www.irctc.co.in/nget/assets/images/second-logo.png"
                 alt="IRCTC Logo" class="brand-logo mb-2">
            <h4 class="fw-bold text-dark">Create Your Account</h4>
            <p class="text-muted small">Join millions of travelers today</p>
        </div>

  
        <div class="card register-card p-4 p-md-5">
            <form id="registerForm">

                <div class="mb-3">
                    <label class="form-label text-uppercase">Full Name</label>
                    <input type="text" id="fullName" class="form-control"
                           placeholder="e.g. Rahul Sharma" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-uppercase">Email Address</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="name@example.com" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label text-uppercase">Password</label>
                        <input type="password" id="password"
                               class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-4">
                        <label class="form-label text-uppercase">Confirm Password</label>
                        <input type="password" id="confirmPassword"
                               class="form-control" required>
                    </div>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label small text-muted">
                        I agree to the IRCTC
                        <a href="#" class="text-decoration-none">Terms</a> &
                        <a href="#" class="text-decoration-none">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="btn btn-irctc w-100 py-2 mb-3">
                    CREATE ACCOUNT
                </button>
            </form>

            <div class="text-center border-top pt-3">
                <p class="small text-muted mb-0">
                    Already have an account?
                    <a href="login.html" class="fw-bold text-decoration-none"
                       style="color:#213d77;">LOGIN</a>
                </p>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("registerForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match");
        return;
    }

    try {
        const response = await fetch("http://127.0.0.1:8000/api/register/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: email,
                email: email,
                password: password
            })
        });

        if (response.ok) {
            alert("Account created successfully. Please login.");
            window.location.href = "login.html";
        } else {
            const data = await response.json();
            alert("Registration failed: " + JSON.stringify(data));
        }

    } catch (error) {
        alert("Server error. Please try again later.");
        console.error(error);
    }
});
</script>

</body>
</html>
