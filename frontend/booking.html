<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookings - IRCTC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f9;
            font-family: 'Inter', sans-serif;
        }
        .navbar-irctc {
            background-color: #213d77;
        }
        .navbar-brand {
            color: #fff !important;
            font-weight: 600;
        }
        .card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
    </style>
</head>

<body>

<script>
if (!localStorage.getItem("access")) {
    window.location.href = "login.html";
}
</script>

<nav class="navbar navbar-irctc px-3">
    <span class="navbar-brand">My Bookings</span>
    <div>
        <a href="index.html" class="btn btn-light btn-sm me-2">Dashboard</a>
        <button class="btn btn-light btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container my-5">
    <div class="card p-4">
        <h5 class="fw-bold mb-3">Booking History</h5>

        <div class="table-responsive">
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Train</th>
                        <th>Route</th>
                        <th>Date</th>
                        <th>Class</th>
                        <th>Seats</th>
                        <th>Booked At</th>
                    </tr>
                </thead>
                <tbody id="bookingTable">
                    <tr>
                        <td colspan="6" class="text-center text-muted">
                            Loading bookings...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}

async function loadBookings() {
    const token = localStorage.getItem("access");

    const response = await fetch(
        "http://127.0.0.1:8000/api/bookings/my/",
        {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        }
    );

    if (response.status === 401) {
        logout();
        return;
    }

    const data = await response.json();
    const tbody = document.getElementById("bookingTable");
    tbody.innerHTML = "";

    if (!data.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center text-muted">
                    No bookings found
                </td>
            </tr>`;
        return;
    }

    data.forEach(b => {
        tbody.innerHTML += `
        <tr>
            <td>${b.train_number} - ${b.train_name}</td>
            <td>${b.source} → ${b.destination}</td>
            <td>${b.journey_date}</td>
            <td>${b.seat_type}</td>
            <td>${b.seats_booked}</td>
            <td>${new Date(b.booked_at).toLocaleString()}</td>
        </tr>`;
    });
}

loadBookings();
</script>

</body>
</html>
